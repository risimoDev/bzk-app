# ==============================================================================
# BZK PRINT — Конфигурация Nginx для Next.js (если разворачивается без Caddy)
# Разместить в: /etc/nginx/sites-available/bzk.conf
# Активация: ln -s /etc/nginx/sites-available/bzk.conf /etc/nginx/sites-enabled/
# Получение SSL: certbot --nginx -d bzkprint.ru -d www.bzkprint.ru
# ==============================================================================

# Пул бэкенда
upstream bzk_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Редирект HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bzkprint.ru www.bzkprint.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bzkprint.ru www.bzkprint.ru;

    # SSL сертификаты (после certbot раскомментировать пути)
    # ssl_certificate /etc/letsencrypt/live/bzkprint.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bzkprint.ru/privkey.pem;

    # Оптимальные параметры SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Максимальный размер загружаемых макетов (50MB для полиграфии)
    client_max_body_size 50M;

    # Сжатие Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Статика Next.js (хэшированная, кэшируем на 1 год)
    location /_next/static/ {
        alias /opt/bzk-app/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Публичные статические файлы из /public
    location /public/ {
        alias /opt/bzk-app/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Проксирование всех запросов к Next.js
    location / {
        proxy_pass http://bzk_backend;
        proxy_http_version 1.1;

        # Поддержка WebSocket (для чата заказов и реалтайм-статусов)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Таймауты для тяжелых операций (генерация PDF-счетов)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
